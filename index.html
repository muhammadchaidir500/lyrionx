/* permintaan pendaftaran & reset password (diverifikasi Super Admin) */
const pendingRegs = () => Store.all('accounts', x => x.pending && (S.user.role === SA || (S.user.role === CO && x.role === US && x.companyId === S.user.companyId)));
const resetReqs = () => S.user.role === SA ? Store.all('accounts', x => x.resetRequest && x.active) : [];
const tmpPw = () => { const U = 'ABCDEFGHJKLMNPQRSTUVWXYZ', L = 'abcdefghijkmnpqrstuvwxyz', N = '23456789', all = U + L + N; const pk = s => s[crypto.getRandomValues(new Uint32Array(1))[0] % s.length]; let p = [pk(U), pk(L), pk(N)]; while (p.length < 10) p.push(pk(all)); return p.sort(() => crypto.getRandomValues(new Uint8Array(1))[0] - 128).join(''); };
function reqPanel() {
  const regs = pendingRegs(), rst = resetReqs(); if (!regs.length && !rst.length) return '';
  const when = x => x ? esc(fmtDateLong(String(x).slice(0, 10))) : '';
  return `<div class="card req-card"><div class="card-head"><h3>Permintaan menunggu tindakan</h3><span class="pill acc">${regs.length + rst.length}</span></div><div class="tbl-wrap"><table class="tbl"><tbody>
    ${regs.map(a => `<tr><td><span class="pill info">Pendaftaran</span></td><td><b>${esc(a.name)}</b><div class="small muted mono">${esc(a.username)}</div></td><td><span class="pill">${ROLE_LABEL[a.role]}</span><div class="small muted">${esc(a.unit || '')} ${esc(a.position || '')}</div></td><td class="small muted">${when(a.requestedAt)}</td><td><div class="row" style="flex-wrap:nowrap"><button class="btn sm primary" data-appr="${a.id}">Setujui</button><button class="btn sm danger" data-rej="${a.id}">Tolak</button></div></td></tr>`).join('')}
    ${rst.map(a => `<tr><td><span class="pill bad">Lupa password</span></td><td><b>${esc(a.name)}</b><div class="small muted mono">${esc(a.username)}</div></td><td><span class="pill">${ROLE_LABEL[a.role]}</span><div class="small muted">${esc(a.resetRequest.note || '')}</div></td><td class="small muted">${when(a.resetRequest.at)}</td><td><div class="row" style="flex-wrap:nowrap"><button class="btn sm primary" data-rst="${a.id}">Verifikasi &amp; buat password</button><button class="btn sm" data-rstx="${a.id}">Abaikan</button></div></td></tr>`).join('')}
  </tbody></table></div><p class="small muted" style="margin:8px 14px 12px">Pastikan identitas pemohon sudah diverifikasi sebelum menyetujui atau memberikan password sementara.</p></div>`;
}
function reqMount(c) {
  $$('[data-appr]', c).forEach(b => b.onclick = async () => { const a = Store.get('accounts', b.dataset.appr); await Store.put('accounts', a.id, { ...a, pending: false, active: true }); audit('setujui pendaftaran', a.username); toast('Akun disetujui'); App.renderContent(); });
  $$('[data-rej]', c).forEach(b => b.onclick = async () => { const a = Store.get('accounts', b.dataset.rej); if (!(await confirmBox(`Tolak dan hapus pendaftaran ${esc(a.username)}?`, 'Tolak', true))) return; await Store.remove('accounts', a.id); audit('tolak pendaftaran', a.username); App.renderContent(); });
  $$('[data-rstx]', c).forEach(b => b.onclick = async () => { const a = Store.get('accounts', b.dataset.rstx); const { resetRequest, ...rest } = a; await Store.put('accounts', a.id, rest); audit('abaikan reset password', a.username); App.renderContent(); });
  $$('[data-rst]', c).forEach(b => b.onclick = async () => {
    const a = Store.get('accounts', b.dataset.rst); if (!(await confirmBox(`Buat password sementara untuk ${esc(a.username)}? Password lama tidak berlaku lagi.`, 'Buat password'))) return;
    const pw = tmpPw(), salt = randSalt(), { resetRequest, ...rest } = a;
    await Store.put('accounts', a.id, { ...rest, salt, passHash: await sha256(salt + ':' + pw) }); audit('reset password', a.username); App.renderContent();
    openModal({ title: 'Password sementara dibuat', body: `<p style="margin:0">Kirim data ini kepada ${esc(a.name)} melalui saluran yang aman, lalu minta ia menggantinya lewat <b>Ganti password</b>:</p><div class="card card-pad mono" style="white-space:pre-wrap">Username : ${esc(a.username)}\nPassword : ${esc(pw)}</div>`, foot: '<button class="btn" id="cpy">Salin</button><button class="btn primary" data-close>Selesai</button>', onMount: rr => $('#cpy', rr).onclick = () => copyText(`Username: ${a.username}\nPassword: ${pw}`) });
  });
}

      <td>${a.active ? '<span class="pill ok">Aktif</span>' : '<span class="pill bad">Nonaktif</span>'}</td>
      <td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-edit="${a.id}">Ubah</button><button class="btn sm" data-tog="${a.id}">${a.active ? 'Nonaktifkan' : 'Aktifkan'}</button></div></td></tr>`; }).join('')}
  </tbody></table></div>` : '<div class="empty">Belum ada akun di perusahaan ini.</div>'}</div>
  <p class="small muted" style="margin:0">Akun Super Admin berlaku untuk semua perusahaan sehingga tidak dicantumkan di daftar ini.</p>`;
};
Views.companyMount = c => {
  const co = Store.get('companies', S.params.id); if (!co) return;
  $('#cAdd', c).onclick = () => accountForm({ companyId: co.id });
  $('#cAct', c).onclick = () => { S.companyId = co.id; App.saveSession(); App.render(); toast('Perusahaan aktif diganti'); };
  $$('[data-edit]', c).forEach(b => b.onclick = () => accountForm(Store.get('accounts', b.dataset.edit)));
  $$('[data-tog]', c).forEach(b => b.onclick = async () => { const a = Store.get('accounts', b.dataset.tog); await Store.put('accounts', a.id, { ...a, active: !a.active }); audit(a.active ? 'nonaktifkan akun' : 'aktifkan akun', a.username); App.renderContent(); });
};

/* ---- Master soal DISC ---- */
Views.discref = () => `<div class="page-head"><div><h1>Master Soal DISC</h1><p>24 nomor soal, kunci pemetaan P (paling sesuai) dan K (paling tidak sesuai), serta 40 tipe pola kepribadian. Data diambil dari SCORING_DISC.xlsm. Tanda * berarti pilihan tidak dihitung ke faktor mana pun.</p></div></div>
  <div class="card"><div class="tbl-wrap"><table class="tbl no-stack"><thead><tr><th class="num">No</th><th>Pernyataan</th><th>Kunci P</th><th>Kunci K</th></tr></thead><tbody>
  ${DD.Q.map(q => q.s.map((s, j) => `<tr>${j === 0 ? `<td class="num" rowspan="4" style="vertical-align:top"><b>${q.n}</b></td>` : ''}<td>${esc(s)}</td><td class="mono">${q.p[j]}</td><td class="mono">${q.k[j]}</td></tr>`).join('')).join('')}
  </tbody></table></div></div>
  <div class="card"><div class="card-head"><h3>40 pola kepribadian</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th class="num">#</th><th>Pola</th><th>Tipe</th><th>Karakter</th></tr></thead><tbody>
  ${DD.DEF.map((d, i) => `<tr><td class="num">${d.no}</td><td class="mono">${esc(DD.PAT[i])}</td><td><b>${esc(d.title)}</b></td><td class="small">${esc(d.traits.join(', '))}</td></tr>`).join('')}
  </tbody></table></div></div>`;

/* ---- Audit ---- */
Views.audit = () => {
  const all = Store.all('audit').flatMap(d => d.entries || []).sort((a, b) => b.t.localeCompare(a.t)).slice(0, 300);
  const cn = id => Store.get('companies', id)?.name || '–';
  return `<div class="page-head"><div><h1>Log Aktivitas</h1><p>300 aktivitas terakhir: login, perubahan data, pengerjaan tes.</p></div></div>
  <div class="card">${all.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Waktu</th><th>Pengguna</th><th>Perusahaan</th><th>Aktivitas</th><th>Detail</th></tr></thead><tbody>
  ${all.map(e => `<tr><td class="small mono">${fmtDT(e.t)}</td><td>${esc(e.user)} <span class="small faint">${esc(ROLE_LABEL[e.role] || e.role)}</span></td><td class="small">${esc(cn(e.companyId))}</td><td>${esc(e.action)}</td><td class="small muted">${esc(e.detail)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Belum ada aktivitas.</div>'}</div>`;
};

/* ---------------- boot ---------------- */
App.start().catch(e => { console.error(e); $('#app').innerHTML = `<div id="boot">Gagal memuat aplikasi: ${esc(e.message || e)}</div>`; });
</script>
</body>
</html>
