<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B29A3">
<title>Unimedika HR Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E8EEFF; --surface:#FFFFFF; --surface-2:#F2F5FF; --line:#B4C1E8; --line-2:#D3DCF5;
  --text:#0A1030; --muted:#333E6B; --faint:#4B5788;
  --brand:#2440E0; --brand-2:#1A2FB0; --brand-soft:#DFE7FF; --brand-text:#18299E; --on-brand:#FFFFFF;
  --side-bg:linear-gradient(180deg,#1B29A3 0%,#0F1670 100%);
  --ink:#141E78; --ink-2:rgba(255,255,255,.14); --ink-text:#FFFFFF; --ink-muted:#C7CFFB;
  --accent:#FF9F0A; --accent-soft:#FFEFCF; --accent-text:#7A4300;
  --ok:#08783C; --ok-soft:#D5F4E1; --warn:#9C5800; --warn-soft:#FFEAC2; --bad:#C0201C; --bad-soft:#FFDAD7; --info:#1155C7; --info-soft:#DAE7FF;
  --dD:#E0332B; --dI:#F5A300; --dS:#12A150; --dC:#1F6FEB;
  --s1:#2A78D6; --s2:#EB6834; --s3:#1BAF7A; --s4:#5B45C9;
  --st-good:#0CA30C; --st-warn:#FAB219; --st-serious:#EC835A; --st-crit:#D03B3B;
  --radius:12px; --shadow:0 1px 2px rgba(20,30,120,.10),0 6px 20px rgba(20,30,120,.08);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A0F26; --surface:#131A3C; --surface-2:#19224D; --line:#37447E; --line-2:#26316A;
    --text:#F3F5FF; --muted:#C6CDF2; --faint:#9DA7D8;
    --brand:#7B92FF; --brand-2:#9FB0FF; --brand-soft:#1F2C70; --brand-text:#BAC6FF; --on-brand:#08102E;
    --side-bg:linear-gradient(180deg,#0E1445 0%,#070B29 100%);
    --ink:#080D2E;
    --accent:#FFB021; --accent-soft:#40300A; --accent-text:#FFCB6B;
    --ok:#4ADE80; --ok-soft:#0F3A24; --warn:#FBBF24; --warn-soft:#3B2C08; --bad:#FF8A80; --bad-soft:#4A1815; --info:#86B6FF; --info-soft:#15325F;
    --dD:#F0645A; --dI:#FFB627; --dS:#3CD07E; --dC:#5B9BFF;
    --s1:#3987E5; --s2:#D95926; --s3:#199E70; --s4:#9085E9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0F26; --surface:#131A3C; --surface-2:#19224D; --line:#37447E; --line-2:#26316A;
  --text:#F3F5FF; --muted:#C6CDF2; --faint:#9DA7D8;
  --brand:#7B92FF; --brand-2:#9FB0FF; --brand-soft:#1F2C70; --brand-text:#BAC6FF; --on-brand:#08102E;
  --side-bg:linear-gradient(180deg,#0E1445 0%,#070B29 100%);
  --ink:#080D2E;
  --accent:#FFB021; --accent-soft:#40300A; --accent-text:#FFCB6B;
  --ok:#4ADE80; --ok-soft:#0F3A24; --warn:#FBBF24; --warn-soft:#3B2C08; --bad:#FF8A80; --bad-soft:#4A1815; --info:#86B6FF; --info-soft:#15325F;
  --dD:#F0645A; --dI:#FFB627; --dS:#3CD07E; --dC:#5B9BFF;
  --s1:#3987E5; --s2:#D95926; --s3:#199E70; --s4:#9085E9;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
#app{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:16px;font-weight:800}
.num,td.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ---------- boot / login ---------- */
#boot{min-height:100%;display:grid;place-items:center;padding:24px 16px;color:var(--muted)}
.login-wrap{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login-side{background:var(--side-bg);color:var(--ink-text);padding:48px clamp(20px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.login-side h1{font-size:clamp(28px,4vw,40px);line-height:1.1;max-width:14ch}
.login-side p{color:var(--ink-muted);max-width:46ch}
.brandmark{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}
.brandmark .dot{width:28px;height:28px;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.brandmark .dot i:nth-child(1){background:var(--dD)} .brandmark .dot i:nth-child(2){background:var(--dI)} .brandmark .dot i:nth-child(3){background:var(--dS)} .brandmark .dot i:nth-child(4){background:var(--dC)}
.disc-quad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px}
.disc-quad div{border-top:3px solid;padding-top:8px;font-size:12px;color:var(--ink-muted)}
.disc-quad b{display:block;font-size:22px;color:var(--ink-text)}
.login-main{display:grid;place-items:center;padding:40px 16px}
.login-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
.demo-accounts{border:1px dashed var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.demo-accounts button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;font-size:13px}
.demo-accounts button:hover,.demo-accounts button:focus-visible{background:var(--line-2)}
@media (max-width:820px){.login-wrap{grid-template-columns:1fr}.login-side{padding:28px 16px}.disc-quad{display:none}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side-bg);color:var(--ink-text);padding:18px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brandmark{padding:4px 8px 10px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group .eyebrow{color:var(--ink-muted);padding:10px 10px 4px;font-size:10.5px}
.nav-item{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-muted);font-weight:600}
.nav-item:hover{background:rgba(255,255,255,.1);color:var(--ink-text)}
.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav-item.on{background:var(--ink-2);color:var(--ink-text);box-shadow:inset 4px 0 0 var(--accent);font-weight:700}
.nav-item svg{color:#9FB0FF}.nav-item.on svg,.nav-item:hover svg{color:var(--accent)}
.nav-item svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;padding:10px;border-top:1px solid var(--ink-2);font-size:12px;color:var(--ink-muted);display:flex;flex-direction:column;gap:8px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-2);padding-block:10px;padding-inline:24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .grow{flex:1}
.content{padding-block:22px 48px;padding-inline:24px;display:flex;flex-direction:column;gap:18px;max-width:1240px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.side-btn{background:transparent;border-color:var(--ink-2);color:var(--ink-text)}
.side-btn:hover{border-color:var(--ink-muted)}
.nav-close,.mbar,.side-backdrop{display:none}
.mbar-btn{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:8px;flex:none}
.mbar-btn:focus-visible,.nav-close:focus-visible{outline:2px solid var(--accent)}
.mbar-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.mbar-title{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.mbar-title span{color:var(--ink-muted);font-size:11px;letter-spacing:.04em}
.mbar-title b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);height:auto;z-index:40;transform:translateX(-105%);transition:transform .22s ease;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 0 40px rgba(0,0,0,.35)}
  .side.open{transform:none}
  .side-backdrop:not([hidden]){display:block;position:fixed;inset:0;background:rgba(12,15,25,.5);z-index:39}
  .nav-close{display:grid;place-items:center;all:unset;cursor:pointer;width:36px;height:36px;text-align:center;line-height:36px;color:var(--ink-muted);border-radius:8px}
  .nav-item{padding:11px 12px;font-size:15px}
  .mbar{display:flex;align-items:center;gap:8px;background:var(--side-bg);color:var(--ink-text);padding-block:calc(6px + env(safe-area-inset-top,0px)) 6px;padding-inline:8px 16px;position:sticky;top:0;z-index:20}
  .topbar{position:static;padding-block:8px;padding-inline:16px}
  .topbar:has(.grow:only-child){display:none}
  .topbar label.row{width:100%;flex-wrap:nowrap}
  .topbar select{flex:1;min-width:0}
  .hide-sm{display:none}
  .content{padding-block:16px 40px;padding-inline:16px;gap:14px}
  h1{font-size:20px}
}
@media (max-width:640px){
  .input,select.input,textarea.input{font-size:16px}
  .page-head{align-items:stretch}
  .page-head>.row,.page-head>.btn{width:100%}
  .page-head>.row>.btn,.page-head>.row>.input{flex:1}
  .page-head>.btn{justify-content:center}
  .grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topbar.co-sm{display:none}
  .kpi{padding:12px 14px}
  .kpi b{font-size:20px!important;word-break:break-word}
  .card-pad{padding:14px}
  .card-head{padding:12px 14px}
  /* tabel menjadi kartu */
  .tbl.stack-sm thead{display:none}
  .tbl.stack-sm,.tbl.stack-sm tbody,.tbl.stack-sm tfoot,.tbl.stack-sm tr,.tbl.stack-sm td{display:block;width:100%}
  .tbl.stack-sm tr{border:1px solid var(--line-2);border-radius:10px;margin:10px 0;padding:4px 12px;background:var(--surface)}
  .card .tbl.stack-sm{padding:0 10px}
  .tbl.stack-sm td{border:0;padding:6px 0;text-align:right;overflow:hidden}
  .tbl.stack-sm td::before{content:attr(data-label);float:left;margin-right:14px;font-size:12px;font-weight:600;color:var(--muted);text-align:left;max-width:45%;line-height:1.9}
  .tbl.stack-sm td[data-label=""]::before{display:none}
  .tbl.stack-sm td .row{justify-content:flex-end}
  .tbl.stack-sm td:first-child{display:block;text-align:left;border-bottom:1px solid var(--line-2);padding:10px 0 8px}
  .tbl.stack-sm td:first-child::before{display:none}
  .tbl.stack-sm td.num{text-align:right}
  .tbl.stack-sm tfoot tr{background:var(--surface-2)}
  .tbl.stack-sm tr.click:hover td{background:transparent}
  /* modal jadi lembar bawah */
  .modal-bg{padding:0;place-items:end stretch}
  .modal,.modal.wide{max-width:none;border-radius:16px 16px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom,0px)}
  .modal-foot .btn{flex:1}
  /* login */
  .login-side{padding:22px 16px;gap:14px}
  .login-side h1{font-size:24px}
  .login-side p{font-size:13px}
  .login-main{padding:24px 16px 40px;place-items:start center}
}

/* ---------- elements ---------- */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--faint)}
.btn:focus-visible,.input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#1A1F33}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:500;color:var(--text);font-size:14px}
textarea.input{min-height:74px;resize:vertical}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--line-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.acc{background:var(--accent-soft);color:var(--accent-text)}
.tag-sample{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-text);background:var(--accent-soft);padding:1px 6px;border-radius:4px;margin-left:6px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.num,.tbl th.num{text-align:right}
.tbl tfoot td{font-weight:700;background:var(--surface-2)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:26px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.note{padding:12px 14px;border-radius:8px;background:var(--info-soft);color:var(--text);font-size:13px;border-left:3px solid var(--info)}
.note.warn{background:var(--warn-soft);border-color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--text);border-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ink-text);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.modal-bg{position:fixed;inset:0;background:rgba(12,15,25,.5);z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:620px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:900px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line-2);flex-wrap:wrap}

/* ---------- test taking ---------- */
.test-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-inline:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer{font-family:var(--mono);font-weight:600;font-size:20px;padding:4px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.progress{height:6px;background:var(--line-2);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.test-body{max-width:760px;width:100%;margin:0 auto;padding-block:22px 60px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.qnav{display:flex;flex-wrap:wrap;gap:6px}
.qnav button{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:7px;border:1px solid var(--line);font-family:var(--mono);font-size:12.5px;background:var(--surface)}
.qnav button.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qnav button.half{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.qnav button.cur{outline:2px solid var(--ink-2);outline-offset:1px}
.qnav button:focus-visible{outline:2px solid var(--accent)}
.stmt{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stmt.p{border-color:var(--ok);background:var(--ok-soft)} .stmt.k{border-color:var(--bad);background:var(--bad-soft)}
.pk{all:unset;cursor:pointer;min-width:44px;height:36px;padding:0 10px;display:grid;place-items:center;border-radius:8px;border:1.5px solid var(--line);font-weight:800;font-size:13px;background:var(--surface);color:var(--muted)}
.pk:focus-visible{outline:2px solid var(--accent)}
.pk.P.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pk.K.on{background:var(--bad);border-color:var(--bad);color:#fff}
.opt{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.opt b{font-family:var(--mono);width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:6px;background:var(--line-2);font-size:12px}
.opt.on{border-color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--ink-2)} .opt.on b{background:var(--ink-2);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent)}

/* ---------- DISC result ---------- */
.disc-charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.disc-charts{grid-template-columns:1fr}}
.chart-card{border:1px solid var(--line-2);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.chart-card svg{width:100%;height:auto;display:block}
.fbadge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;color:#fff;font-weight:800;font-size:12px}
.fD{background:var(--dD)} .fI{background:var(--dI)} .fS{background:var(--dS)} .fC{background:var(--dC)}
.pattern-big{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted)}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.traits span{padding:3px 9px;border-radius:6px;background:var(--line-2);font-size:12.5px}
.reco{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.gauge{width:96px;height:96px}
@media (max-width:520px){.reco{grid-template-columns:1fr}}
.prose{max-width:72ch}
.prose p{margin:0 0 10px}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
/* ---------- Excel-style DISC sheet ---------- */
.xl-wrap{max-width:1280px;width:100%;margin:0 auto;padding-block:18px 60px;padding-inline:16px;display:flex;flex-direction:column;gap:14px}
.xl-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:0}
.xl-head>div{padding:16px 18px}
.xl-id{border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px}
.xl-ins{font-size:13.5px;line-height:1.6;background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0}
.xl-ins ol{margin:4px 0 6px;padding-left:20px}
@media (max-width:760px){.xl-head{grid-template-columns:1fr}.xl-id{border-right:0;border-bottom:1px solid var(--line-2)}.xl-ins{border-radius:0 0 var(--radius) var(--radius)}}
.xl-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:13.5px}
.xl-dl dt{color:var(--muted);font-weight:600}
.xl-dl dd{margin:0;font-weight:600}
.xl-dl dd::before{content:": ";color:var(--faint)}
.xl-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:720px){.xl-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1120px){.xl-grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(8,auto);grid-auto-flow:column}}
.xl-q{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.xl-q.done{border-color:var(--ok)} .xl-q.half{border-color:var(--warn)}
.xl-qh{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:var(--surface-2);border-bottom:1px solid var(--line-2);font-size:13px}
.xl-q.done .xl-qh{background:var(--ok-soft);color:var(--ok)} .xl-q.half .xl-qh{background:var(--warn-soft);color:var(--warn)}
.xl-t{width:100%;border-collapse:collapse;font-size:13.5px}
.xl-t th{font-size:11px;font-weight:800;color:var(--muted);padding:5px 6px;text-align:center;border-bottom:1px solid var(--line-2)}
.xl-t th:last-child{text-align:left}
.xl-t td{padding:4px 6px;border-bottom:1px solid var(--line-2)}
.xl-t tr:last-child td{border-bottom:0}
.xl-t td:nth-child(-n+2){width:42px;text-align:center}
.xl-t tr.rp td:last-child{color:var(--ok);font-weight:600} .xl-t tr.rk td:last-child{color:var(--bad);font-weight:600}
.xbox{all:unset;cursor:pointer;width:30px;height:26px;display:inline-grid;place-items:center;border:1.5px solid var(--line);border-radius:5px;font-family:var(--mono);font-weight:700;font-size:15px;background:var(--surface)}
.xbox:hover{border-color:var(--faint)}
.xbox:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.xbox.P.on{background:var(--ok);border-color:var(--ok);color:#fff}
.xbox.K.on{background:var(--bad);border-color:var(--bad);color:#fff}
.xl-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:4}
.xl-status{font-weight:800;font-size:16px;letter-spacing:.02em}
.xl-status.ok{color:var(--ok)} .xl-status.bad{color:var(--bad)}
.xl-rhead{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:24px;align-items:center;padding:18px}
.xl-big{font-size:30px;font-weight:800;letter-spacing:.35em}
.xl-score{min-width:320px}
@media (max-width:900px){.xl-rhead{grid-template-columns:1fr}}
@media (max-width:640px){
  .test-top{gap:8px 10px;padding-block:calc(8px + env(safe-area-inset-top,0px)) 8px}
  .test-top .brandmark{font-size:12px!important;flex:1}
  .test-top .progress{order:5;flex-basis:100%}
  .test-top .pill{font-size:11px;order:4}
  .timer{font-size:17px;padding:3px 10px}
  .xl-wrap{padding-block:12px 40px;gap:12px}
  .xl-head>div{padding:14px}
  .xl-t{font-size:14px}
  .xbox{width:34px;height:30px}
  .xl-foot{flex-direction:column;align-items:stretch;gap:10px;padding:12px 14px}
  .xl-foot .btn{width:100%}
  .xl-status{font-size:14px}
  .xl-rhead{padding:14px;gap:14px}
  .xl-big{font-size:24px}
  .chart-card svg{max-width:340px;margin:0 auto}
  .reco{justify-items:center;text-align:center}
  .reco .row{justify-content:center}
  .qnav button{width:36px;height:36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ================= v2: warna hidup, kontras tinggi, menu hover ================= */
.page-head h1{border-left:6px solid var(--accent);padding-left:12px}
.page-head p{font-size:14.5px}
.card{border-color:var(--line)}
.btn{border:1.5px solid var(--line);font-weight:700}
.btn:hover{border-color:var(--brand);color:var(--brand-text)}
.btn.primary:hover{color:var(--on-brand)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.input,select.input,textarea.input{border:1.5px solid var(--line);font-weight:600}
.input:hover,select.input:hover{border-color:var(--brand)}
label.f{color:var(--muted);font-weight:700;font-size:13px}
a{color:var(--info);font-weight:600}
.pill{font-weight:800;font-size:12.5px;padding:3px 10px}
.pill.info{background:var(--info-soft);color:var(--info)}
.tbl th{background:var(--brand-soft);color:var(--brand-text);font-weight:800;border-bottom:2px solid var(--line);font-size:12px}
.tbl td{font-size:14.5px}
.tbl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--brand-soft) 30%,transparent)}
.tbl tr.click:hover td,.tbl tr.click:focus-visible td{background:var(--brand-soft)}
.tbl tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl tfoot td{background:var(--brand-soft);color:var(--brand-text)}
.chev{font-size:22px;font-weight:800;color:var(--brand);line-height:1;padding:0 4px}
.tabs{border-bottom:2px solid var(--line)} .tab{color:var(--muted);font-weight:700} .tab.on{color:var(--brand-text);border-color:var(--brand)}
.opt.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)} .opt.on b{background:var(--brand);color:var(--on-brand)}
.qnav button.cur{outline-color:var(--brand)}
.progress i{background:linear-gradient(90deg,var(--brand),var(--s3))}
.user-chip{font-size:13.5px}
.eyebrow{color:var(--muted)}

/* KPI berwarna */
.kpi{border:0;color:#fff;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-22px;top:-22px;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.14)}
.kpi .eyebrow,.kpi .small{color:rgba(255,255,255,.94)}
.kpi b{font-size:30px;color:#fff}
.kpi.k-blue{background:linear-gradient(135deg,#1F3BD6,#4A6BFF)}
.kpi.k-teal{background:linear-gradient(135deg,#065F56,#0B8F80)}
.kpi.k-orange{background:linear-gradient(135deg,#A83208,#CC4409)}
.kpi.k-purple{background:linear-gradient(135deg,#4C1D95,#7A3AE6)}

/* dashboard */
.filters{display:flex;gap:12px 16px;align-items:flex-end;flex-wrap:wrap}
.filters label.f{min-width:150px;flex:0 1 190px}
.hbar{display:grid;grid-template-columns:minmax(96px,32%) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.hbar-l{font-size:14px;font-weight:700;line-height:1.25}
.hbar-t{height:24px;background:var(--line-2);border-radius:6px;overflow:hidden;display:flex;gap:2px}
.hbar-t>i{display:block;height:100%;border-radius:0 5px 5px 0}
.hbar-t>i:hover,.seg-wrap>i:hover,.mcol .bars i:hover{filter:brightness(1.12)}
.seg-wrap{display:flex;gap:2px;height:100%}
.seg-wrap>i{display:block;height:100%;border-radius:0 5px 5px 0;min-width:4px}
.hbar-v{font-family:var(--mono);font-weight:700;font-size:14px;min-width:70px;text-align:right;display:flex;flex-direction:column;line-height:1.2}
.hbar-v span{font-size:11.5px;font-weight:600;color:var(--muted)}
.stack-bar>i{border-radius:0}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13.5px;font-weight:600}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut-wrap .legend{flex-direction:column;gap:8px}
.mchart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end}
.mcol{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 4px;border-radius:8px}
.mcol.sel{background:var(--brand-soft);outline:2px solid var(--brand);outline-offset:-2px}
.mcol .bars{height:170px;display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%;border-bottom:2px solid var(--line)}
.mcol .bars i{display:block;width:min(14px,42%);border-radius:4px 4px 0 0}
.mcol .lab{font-size:12px;font-weight:800;color:var(--muted)}
.mcol .val{font-family:var(--mono);font-size:12px;font-weight:700}
details>summary{padding:4px 0}

/* tanda tangan HR di hasil */
.sig-wrap{display:flex;justify-content:flex-end}
.sig{width:min(100%,300px);display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--surface)}
.sig-line{height:1.5px;background:var(--text);margin:56px 0 6px}

/* menu kiri: ikon saja, terbuka saat kursor diarahkan */
@media (min-width:901px){
  .shell{display:block;padding-left:76px;min-height:100%}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:76px;z-index:40;padding:16px 12px;overflow:hidden;white-space:nowrap;transition:width .22s ease,box-shadow .22s ease}
  .side:hover,.side:focus-within{width:292px;overflow-y:auto;box-shadow:12px 0 48px rgba(6,10,60,.5)}
  .side .brandmark{padding:4px 6px 12px}
  .side .brand-text,.side .nav-item span,.side .nav-group .eyebrow,.side .side-foot{opacity:0;transition:opacity .15s ease}
  .side:hover .brand-text,.side:focus-within .brand-text,.side:hover .nav-item span,.side:focus-within .nav-item span,.side:hover .nav-group .eyebrow,.side:focus-within .nav-group .eyebrow,.side:hover .side-foot,.side:focus-within .side-foot{opacity:1}
  .side:not(:hover):not(:focus-within) .side-foot{pointer-events:none}
  .nav-item{padding:11px 14px;gap:16px}
  .nav-item svg{width:20px;height:20px}
  .nav-group .eyebrow{padding:8px 14px 2px}
  .side-foot{border-top-color:rgba(255,255,255,.18)}
}
@media (max-width:640px){
  .kpi b{font-size:22px!important}
  .hbar{grid-template-columns:minmax(0,1fr) auto}
  .hbar-l{grid-column:1/-1}
  .filters label.f{flex:1 1 100%}
  .donut-wrap{justify-content:center}
  .mcol .lab{font-size:10.5px}
  .sig{width:100%}
}

/* ===== v3: login animasi + latar beranda bergerak ===== */
.login-side{isolation:isolate}
.login-side>*{position:relative;z-index:1}
.login-side>.fx-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.login-side>.fx-orbs{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fx-orbs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;will-change:transform}
.fx-orbs i:nth-child(1){width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:radial-gradient(circle,#3D5BFF,transparent 65%);animation:orb1 22s ease-in-out infinite alternate}
.fx-orbs i:nth-child(2){width:38vmax;height:38vmax;right:-14vmax;bottom:-10vmax;background:radial-gradient(circle,#12B8A6,transparent 65%);animation:orb2 26s ease-in-out infinite alternate}
.fx-orbs i:nth-child(3){width:26vmax;height:26vmax;left:30%;top:42%;background:radial-gradient(circle,#8B5CF6,transparent 65%);opacity:.4;animation:orb3 30s ease-in-out infinite alternate}
@keyframes orb1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes orb2{to{transform:translate(-16vmax,-12vmax) scale(1.1)}}
@keyframes orb3{to{transform:translate(-12vmax,10vmax) scale(.85)}}
.rise{opacity:0;transform:translateY(16px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}
.disc-quad div{animation:floaty 6s ease-in-out infinite}
.disc-quad div:nth-child(2){animation-delay:-1.5s}.disc-quad div:nth-child(3){animation-delay:-3s}.disc-quad div:nth-child(4){animation-delay:-4.5s}
@keyframes floaty{50%{transform:translateY(-5px)}}
.login-main{background:var(--bg);position:relative;overflow:hidden}
.login-card{position:relative;z-index:1;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:28px 26px;box-shadow:0 18px 50px rgba(20,35,140,.16)}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:2px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);text-align:center;font-size:13.5px;transition:border-color .2s,background .2s,transform .2s,box-shadow .2s}
.role-opt .ri{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-text);transition:background .2s,color .2s}
.role-opt:hover{transform:translateY(-2px);border-color:var(--brand)}
.role-opt:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.role-opt.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 6px 18px rgba(36,64,224,.22)}
.role-opt.on .ri{background:var(--brand);color:var(--on-brand)}
.pw-wrap{position:relative;display:block}
.pw-wrap .input{width:100%;padding-right:78px;box-sizing:border-box}
.pw-eye{all:unset;cursor:pointer;position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:5px 9px;font-size:12px;font-weight:700;color:var(--brand-text);border-radius:6px}
.pw-eye:hover,.pw-eye:focus-visible{background:var(--brand-soft)}
@media (max-width:820px){.login-side{min-height:210px}.login-card{padding:22px 18px}}
/* beranda: gradasi ambient yang bergerak pelan di belakang konten */
body.has-user::before,body.has-user::after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(70px);opacity:.5}
body.has-user::before{width:52vmax;height:52vmax;right:-16vmax;top:-18vmax;background:radial-gradient(circle,rgba(61,91,255,.42),transparent 65%);animation:orb2 28s ease-in-out infinite alternate}
body.has-user::after{width:44vmax;height:44vmax;left:8vmax;bottom:-22vmax;background:radial-gradient(circle,rgba(18,184,166,.34),transparent 65%);animation:orb1 34s ease-in-out infinite alternate}
body.has-user .shell,body.has-user .mbar{position:relative;z-index:1}
body.has-user .shell{background:transparent}
.content>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.content>*:nth-child(2){animation-delay:.05s}.content>*:nth-child(3){animation-delay:.1s}.content>*:nth-child(4){animation-delay:.15s}
@media (prefers-reduced-motion:reduce){.rise,.content>*{opacity:1!important;transform:none!important}}

/* ===== v4: latar layar penuh, manfaat paperless, lupa password, daftar ===== */
.login-wrap{position:relative;overflow:hidden;background:var(--side-bg)}
.login-wrap>.fx-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.login-wrap>.fx-orbs{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.login-wrap>.login-side,.login-wrap>.login-main{position:relative;z-index:1}
.login-side{background:transparent}
.login-main{background:transparent}
.login-card{box-shadow:0 24px 70px rgba(4,8,50,.45)}
.paperless{max-width:460px;display:flex;flex-direction:column;gap:12px}
.paperless .eyebrow{color:var(--ink-muted)}
.paperless ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.paperless li{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.5;color:var(--ink-muted)}
.paperless li b{color:var(--ink-text)}
.paperless .pi{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#9FF3E6}
.link-btn{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--brand-text);border-radius:4px;padding:1px 3px}
.link-btn:hover{text-decoration:underline}.link-btn:focus-visible{outline:2px solid var(--brand)}
.or-line{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:-4px 0}
.or-line::before,.or-line::after{content:"";flex:1;height:1px;background:var(--line)}
.req-card{border-color:var(--brand)}
.req-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
@media (max-width:820px){.login-side{min-height:0}.paperless{max-width:none}}
div.f{display:flex;flex-direction:column;gap:5px}
div.f>label{color:var(--muted);font-weight:700;font-size:13px}

/* ===== v5: logo, menu akun, kembali, LyrionX + jam, welcome ===== */
.brand-logo{width:36px;height:36px;flex:none;object-fit:contain;background:#fff;border-radius:10px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.test-top .brand-logo{width:28px;height:28px;border-radius:8px}
.login-stack{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;align-items:stretch;position:relative;z-index:1}
.lx-pill{align-self:flex-end;display:flex;align-items:center;gap:10px;text-decoration:none;background:#fff;color:#14233F;border-radius:999px;padding:6px 16px 6px 8px;box-shadow:0 8px 26px rgba(4,8,50,.35);transition:transform .2s,box-shadow .2s}
.lx-pill:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(4,8,50,.45)}
.lx-pill img{height:30px;width:auto;display:block}
.lx-pill span{display:flex;flex-direction:column;line-height:1.15}
.lx-pill b{font-size:13px;color:#2F7C82}.lx-pill small{font-size:11.5px;color:#3A4A66;font-weight:600}
/* menu akun */
.acct{position:relative}
.acct-btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:9px;padding:5px 10px 5px 6px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);transition:border-color .15s,box-shadow .15s}
.acct-btn:hover,.acct-btn[aria-expanded="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.acct-btn:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.acct-av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800;font-size:14px}
.acct-tx{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.acct-tx b{font-size:13px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-tx small{font-size:11.5px;color:var(--muted);font-weight:600}
.acct-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 44px rgba(10,20,90,.28);padding:6px;z-index:30;animation:rise .18s ease both}
.acct-menu[hidden]{display:none}
.acct-menu button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--text)}
.acct-menu button:hover,.acct-menu button:focus-visible{background:var(--brand-soft);color:var(--brand-text)}
.acct-menu button.danger{color:var(--bad,#C2271B)}
.acct-menu button.danger:hover{background:var(--bad-soft,#FFE3E0)}
/* lyrionx + jam di kanan atas */
.lx-block{display:flex;flex-direction:column;align-items:flex-end;gap:3px;line-height:1.1}
.lx-link{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:12.5px;font-weight:800;color:var(--brand-text)}
.lx-link img{height:26px;width:auto;background:#fff;border-radius:8px;padding:3px 5px;box-shadow:0 1px 6px rgba(10,20,90,.18)}
.lx-link:hover span{text-decoration:underline}
.lx-clock{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.mbar-lx{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-decoration:none;color:var(--ink-muted);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.mbar-lx img{height:20px;width:auto;background:#fff;border-radius:6px;padding:2px 4px}
@media (min-width:901px){.mbar-lx{display:none}.side-foot .row{display:none}}
/* kembali */
.back-row{display:flex;margin-bottom:-6px}
.back-home{font-weight:800}
/* nomor urut */
.tbl td.no-col{width:44px;font-weight:800;color:var(--brand-text)}
/* welcome */
.welcome{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--side-bg);color:var(--ink-text);cursor:pointer;overflow:hidden;animation:wlFade .4s ease both;transition:opacity .6s ease,visibility .6s}
.welcome.out{opacity:0;visibility:hidden;pointer-events:none}
@keyframes wlFade{from{opacity:0}}
.wl-orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6}
.wl-orb.a{width:55vmax;height:55vmax;left:-15vmax;top:-18vmax;background:radial-gradient(circle,#3D5BFF,transparent 65%);animation:orb1 9s ease-in-out infinite alternate}
.wl-orb.b{width:45vmax;height:45vmax;right:-14vmax;bottom:-16vmax;background:radial-gradient(circle,#12B8A6,transparent 65%);animation:orb2 9s ease-in-out infinite alternate}
.wl-box{position:relative;z-index:1;text-align:center;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.wl-logo{width:84px;height:84px;background:#fff;border-radius:24px;padding:8px;object-fit:contain;box-shadow:0 14px 44px rgba(0,0,0,.35);animation:wlPop .8s cubic-bezier(.2,1.3,.3,1) both}
.wl-word{margin:0;font-size:clamp(44px,11vw,88px);font-weight:800;letter-spacing:.02em;line-height:1.05;display:flex}
.wl-word span{display:inline-block;animation:wlIn .75s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.075s + .35s)}
.wl-sub{margin:0;font-size:clamp(16px,3.2vw,22px);color:var(--ink-muted);animation:wlUp .7s ease both;animation-delay:1.25s}
.wl-sub b{color:var(--ink-text)}
.wl-line{width:min(260px,60vw);height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;animation:wlUp .5s ease both;animation-delay:1.3s}
.wl-line i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#6F8BFF,#22D3C5,#FFB627);transform-origin:left;animation:wlBar 1.6s cubic-bezier(.4,0,.2,1) 1.35s both}
.wl-org{margin:0;font-size:12.5px;color:var(--ink-muted);letter-spacing:.06em;animation:wlUp .6s ease both;animation-delay:1.5s}
@keyframes wlIn{from{opacity:0;transform:translateY(34px) scale(.9);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes wlUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes wlPop{from{opacity:0;transform:scale(.5) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes wlBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.wl-word span,.wl-logo,.wl-sub,.wl-line,.wl-org,.wl-line i{animation:none!important;opacity:1!important;transform:none!important;filter:none!important}}
@media (max-width:820px){.lx-pill{align-self:center}}
@media (max-width:900px){.tbl.stack-sm td.no-col{width:100%;font-size:13px}.tbl.stack-sm td.no-col::before{content:'No';display:inline}}
</style>

g kuat membuatnya tidak nyaman di bawah kendali orang lain; ia lebih suka menjadi \"boss\" dan menetapkan standard tinggi baik untuk dirinya maupun orang lain. Ia menghindari sesuatu yang biasa-biasa dan cenderung mencari tantangan yang baru. Ia menyukai petualangan dan kadang-kadang beralih ke dalam petualangan baru sebelum mempertimbangkannya secara menyeluruh. Mampu memimpin situasi dan orang lain dalam rangka mencapai sasarannya; ia ingin selalu unggul dalam persaingan dengan taruhan apapun."},{"no":3,"label":"D / C-D","title":"DESIGNER","traits":["Sensitif","Kurang Cepat","Anti Tekanan ","Terlalu Mandiri","Kurang Percaya Orang Lain","Anti Kritik","Dingin","Kreatif","Result Oriented","Suka Tantangan"],"job":"Engineering (Management, Research, Design), Research (R&D), Planning, Chemist, Accountancy, Specialist, Finance, Technician, Quality Control, Production Planning/Management, Design Engineer, Bookkeeper, Chemist Technician, Safety Officer, Librarian.","desc":"Seorang yang sangat berorientasi pada tugas dan sensitif pada permasalahan. Ia lebih mempedulikan tugas yang ada dibanding orang-orang di sekitarnya, termasuk perasaan mereka. Sangat kukuh/keras dan mempunyai pendekatan yang efektif dalam pemecahan masalah. Oleh karena sifat alamiah dan keinginannya akan hasil yang terukur, Akan tampak dingin, tidak berperasaan dan menjaga jarak. Ia membuat keputusan berdasar pada fakta, bukan emosi. Cenderung pendiam dan tidak mudah percaya."},{"no":4,"label":"D / I-D","title":"NEGOTIATOR","traits":["Suka Bergaul","Anti Rutin","Aktif","Terlalu Percaya Diri","Agresif","Optimis","Kurang Detail","Result Oriented"],"job":"Sales and Marketing (Directing, Manager, Person), Public Relations, Recruitment Consultant, Politician, Director, Self-Employed, Hotelier, Travel Agent, Trainer, Hospitality, Lawyer, Solicitor, Motivators, Team Leader, Politician, Trainer, Lecturer, Theatrical Agent, General Management and Leading People, Attorney.","desc":"Merupakan seorang pemimpin integratif yang bekerja dengan dan melalui orang lain.  Ia ramah, memiliki perhatian yang tinggi akan orang dan juga mempunyai kemampuan untuk memperoleh hormat dan penghargaan dari berbagai tipe orang.  Melakukan pekerjaannya dengan cara yang bersahabat, baik dalam mencapai sasarannya maupun meyakinkan pandangannya kepada orang lain.  Ia tidak begitu memperhatikan hal-hal kecil.  Kadang bertindak sesuai dengan kata hati/impulsif, terlalu antusias dan sangat banyak bicara.  Ia terlalu berlebihan menilai kemampuannya dalam memotivasi atau mengubah perilaku orang lain.  Mencari kebebasan dari rutinitas, menginginkan otoritas/wewenang dan juga prestise.  Ia menginginkan aktivitas yang bervariasi dan bekerja lebih efisien jika data-data analitis disediakan oleh orang lain.  Menginginkan penugasan yang mengutamakan mobilitas dan tantangan."},{"no":5,"label":"D / I-D-C","title":"CONFIDENT & DETERMINED","traits":["Pandai Memilih Orang","Leader","Good Interpersonal Skill","Dominan","Agresif","Perfeksionis","Good Communication Skill","Aktif","Need Recognition n Reward","Kurang Peduli pada Aturan","Terburu-buru"],"job":"Specialist/Technical Selling (Computer, Finance, Engineer and others, Chef, Technical/Capital Equipment Selling), Financial (Manager, Specialist), Computer Hardware Sales, Engineering (Manager, Designer, Buyer, Draughtsman), Project Engineer, Sales Engineer, Consultant, Trainer, Lecturer, Hotelier, Insurance, Mortgage and Finance Sales, Teacher, Travel Agent, Personnel and Marketing Services.","desc":"Sangat berorientasi terhadap tugas dan juga menyukai orang.  Ia sangat baik dalam menarik orang/recruiting.  Seorang yang bersahabat, tetapi menyukai keadaan di mana tugas-tugas harus dilakukan dengan benar.  Ia kadang-kadang tampak dingin dan mendominasi.  Ia juga bisa sangat fokus pada tugas dan melupakan orang-orang di sekitarnya.  Sangat mengharapkan orang-orang terlibat dalam proyeknya, tetapi tidak memperdulikan apa yang diinginkan oleh orang-orang itu.  Ia perlu mendengar dan memikirkan  apa yang menjadi keinginan orang di sekitarnya, khususnya kesempatan untuk mencoba.  Ia sangat membutuhkan persetujuan sosial seperti halnya ia sangat mempercayai orang lain.  Karena itu, ia kadang-kadang berlebihan dalam menilai orang dan kemampuannya.  Ia tampak tidak konsisten dan tidak karuan karena ketidakmampuannya berkonsentrasi dan fokus dalam waktu yang lama.  Perlu belajar untuk secara sungguh-sungguh mendengarkan orang-orang di sekitarnya dari pada selalu berpikir apa yang ingin dikatakan.  Ia mempunyai kemampuan logika yang tinggi ketika ia mau menggunakannya."},{"no":6,"label":"D / I-D-S","title":"REFORMER","traits":["Mudah Bergaul","Leader","Sadar Diri","Butuh Pujian & Penghargaan","Cepat Percaya Orang","Mudah Simpati & Empati","Motivator","Optimis & Positif","Anti Aturan","Kurang Detail","Terlalu Selektif"],"job":"Hotelier, Customer Service, Complaints Manager, Recruiting Agent, Sales (Manager/Person), Marketing Services, Public Relations, Politician, Computer Software Sales, Lecturer, Engineering and Production (Manager/Supervisor).","desc":"Seorang yang bersahabat dan sosial; ia juga suka mengendalikan situasi dan menjadi pemimpin.  Ia menyelesaikan tugasnya melalui keterampilan sosialnya; ia peduli dan menerima orang lain.  Ia berkonsentrasi pada tugas yang ada di tangannya sampai selesai dan akan minta bantuan orang lain jika perlu.  Ia menyadari keterbatasannya dan meminta bantuan jika memerlukannya.  Ia disukai dan orang ingin menolongnya.  Senang membagi kebanggaannya dengan kelompok; ia seorang team player tetapi juga team leader.  Menginginkan popularitas dan pengakuan."},{"no":7,"label":"D / I-S-D","title":"MOTIVATOR","traits":["Leader (Kelompok Kecil)","Supporter","Sosialisasi Baik","Butuh Ketegasan","Butuh Pujian & Penghargaan","Kurang Detail","Agak Kaku"],"job":"Hotelier, Community Counseling, Customer Service, Complaints Manager, Community Work, Recruitment Consultant, Hospitality, Teacher, Telemarketing, Production Manager, Complaints Manager, Recruiting Agent, Sales (Manager/Person), Marketing Services, Public Relations, Politician, Call Centre Manager, Lecturer, Engineering and Production (Manager/Supervisor).","desc":"Seorang yang menampilkan gaya bersemangat ketika termotivasi pada sasaran.  Ia lebih suka memimpin atau melibatkan diri, walaupun ia juga mau melayani sebagai pembantu.  Ia membutuhkan pengakuan dan penghargaan serta senang pada peran pendukung.  Ia peduli kepada orang-orang di sekitarnya dan akan mempertimbangkan perasaan orang lain dalam proses pengambilan keputusan.  Menampilkan keterampilan berhubungan dan berkomunikasi dengan sangat baik.  Ia akan berusaha keras menyelesaikan tugas dengan cepat dan efisien."},{"no":8,"label":"D / S-D-C / S-C-D","title":"INQUIRER","traits":["Full Self Control","Sabar","Penuh Pertimbangan","Good Interpersonal","Selektif","Lambat Adaptasi","Inisiatif kurang","Result Oriented","Kaku dan Keras Kepala","Good Service","Kurang dlm hal Managerial"],"job":"Directing, Managing or Supervising (in Engineering, Accountancy, Research and Development and Computing disciplines), Research Manager, Scientific Work, Accountant, Administration, Project Engineer, Draughtsman, Designer, Analyst, Finance, Chemist, Technical Service Support, Flight Attendant, Technician, Service Engineer, Service Manager, Security Specialist.","desc":"Seorang yang sabar, terkontrol dan suka menggali fakta dan jalan keluar.  Ia tenang dan ramah.  Ia merencanakan pekerjaan dengan hati-hati, tetapi agresif, menanyakan sesuatu serta mengumpulkan data pendukung.  Kemudian ia bekerja dengan konsisten dengan arahan yang benar.  Menjadi individu yang penuh perhatian, rendah hati, dan ia berhubungan baik dengan hampir semua orang.  Seorang yang konsisten dan suka menolong. People skill darinya melebihi orientasi tugasnya."},{"no":9,"label":"D-I","title":"PENGAMBIL KEPUTUSAN","traits":["Pekerja Keras","Leader","Banyak Minat","Dingin / Task Oriented","Kurang Pergaula       catch (e) {

  }
};

function otMultiplier(hours, dayType, workDays) {
  const h = Math.max(0, +hours || 0);

  const a = +workDays === 6 ? 7 : 8;

    const inMonth = !onlyMonth || `${d.getFullYear()}-${pad(d.getMonth() + 1)}` === onlyMonth;
    if (!off && inMonth) n++;

  let otHours = 0, otMult = 0;
  ots.forEach(o => { otHours += +o.hours || 0; otMult += otMultiplier(o.hours, o.dayType, st.workDays); });

function stackTables(root) {
  $$('table.tbl:not(.no-stack)', root).forEach(t => {
    const ths = $$('thead th', t); if (!ths.length) return;
    const labels = []; ths.forEach(th => { const n = +(th.getAttribute('colspan') || 1); for (let i = 0; i < n; i++) labels.push(th.textContent.trim()); });
    t.classList.add('stack-sm');
    $$('tbody tr, tfoot tr', t).forEach(tr => { let ci = 0; [...tr.children].forEach(td => { td.dataset.label = labels[ci] || ''; ci += +(td.getAttribute('colspan') || 1); }); });
  });
}
function closeModal() { $('#modal-root').innerHTML = ''; }
function confirmBox(msg, okLabel = 'Ya, lanjutkan', danger = false) {
  return new Promise(res => {
    openModal({ title: 'Konfirmasi', body: `<p style="margin:0">${msg}</p>`,
      foot: `<button class="btn" data-no>Batal</button><button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${esc(okLabel)}</button>`,
      onMount: r => { $('[data-yes]', r).onclick = () => { closeModal(); res(true); }; $('[data-no]', r).onclick = () => { closeModal(); res(false); }; $$('[data-close]', r).forEach(b => b.addEventListener('click', () => res(false))); } });
  });
}
function formData(form) { const o = {}; new FormData(form).forEach((v, k) => { o[k] = typeof v === 'string' ? v.trim() : v; }); return o; }
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); toast('Disalin ke clipboard'); }
  catch (e) { openModal({ title: 'Salin teks', body: `<textarea class="input" style="min-height:180px" readonly>${esc(txt)}</textarea><p class="small muted" style="margin:0">Pilih semua teks lalu salin manual.</p>`, onMount: r => $('textarea', r).select() }); }
}
async function download(filename, data) {
  const isBlob = typeof Blob !== 'undefined' && data instanceof Blob;
  if (!window.claude) {
    try { const url = URL.createObjectURL(isBlob ? data : new Blob([data], { type: 'text/csv;charset=utf-8' })); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); }
    catch (e) { if (isBlob) toast('Gagal menyimpan file'); else copyText(data); }
    return;
  }
  try { const dl = await claude.use('downloads'); if (!dl) throw { code: 'unavailable' }; await dl.save({ filename, data }); }
  catch (e) { if (e?.code === 'cancelled' || e?.code === 'declined') return; if (isBlob) toast('Penyimpanan file tidak tersedia di tampilan ini.'); else copyText(data); }
}

const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
function clockText(short) {
  const d = new Date(), p = n => String(n).padStart(2, '0'), t = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  if (short) return t;
  let z = ''; try { z = new Intl.DateTimeFormat('id-ID', { timeZoneName: 'short' }).formatToParts(d).find(x => x.type === 'timeZoneName').value; } catch (e) {}
  return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()].slice(0, 3)} ${d.getFullYear()} \u00b7 ${t}${z ? ' ' + z : ''}`;
}
let _clockT = null;
function startClock() {
  clearInterval(_clockT);
  const up = () => { const els = $$('[data-clock]'); if (!els.length) { clearInterval(_clockT); return; } els.forEach(e => { e.textContent = clockText(e.dataset.clock === 'short'); }); };
  up(); _clockT = setInterval(up, 1000);
}
function showWelcome(name) {
  $$('.welcome').forEach(x => x.remove());
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const o = document.createElement('div'); o.className = 'welcome'; o.setAttribute('role', 'status');
  o.innerHTML = `<div class="wl-orb a"></div><div class="wl-orb b"></div><div class="wl-box"><img class="wl-logo" src="${LOGO_UM}" alt=""><h1 class="wl-word" aria-label="Welcome">${'Welcome'.split('').map((ch, i) => `<span style="--i:${i}" aria-hidden="true">${ch}</span>`).join('')}</h1><p class="wl-sub">Selamat datang, <b>${esc(name)}</b></p><div class="wl-line"><i></i></div><p class="wl-org">Unimedika HR Suite \u00b7 RS Unimedika Setu Bekasi</p></div>`;
  document.body.appendChild(o);
  let done = false; const end = () => { if (done) return; done = true; o.classList.add('out'); setTimeout(() => o.remove(), 650); };
  const t = setTimeout(end, reduce ? 900 : 3000);
  o.onclick = () => { clearTimeout(t); end(); };
}

Views.loginMount = () => {
  let pick = 'admin';
  $$('.role-opt').forEach(b => b.onclick = () => {
    pick = b.dataset.role;
    $$('.role-opt').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
    $('#roleHint').textContent = LOGIN_ROLES[pick].hint; $('#loginErr').hidden = true; $('#lu').focus();
  });
  $('#pwEye').onclick = () => { const i = $('#lp'), show = i.type === 'password'; i.type = show ? 'text' : 'password'; $('#pwEye').textContent = show ? 'Sembunyi' : 'Lihat'; };
  $('#forgotBtn').onclick = () => Views.forgotPassword($('#lu').value.trim());
  $('#regBtn').onclick = () => Views.registerAccount(pick);
  Views.loginFx();
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const u = $('#lu').value.trim().toLowerCase(), p = $('#lp').value;
    const err = $('#loginErr'); err.hidden = true;
    const t = LOCK.tries[u] || { n: 0, until: 0 };
    if (t.until > Date.now()) { err.textContent = `Terlalu banyak percobaan. Coba lagi dalam ${Math.ceil((t.until - Date.now()) / 60000)} menit.`; err.hidden = false; return; }
    const a = Store.all('accounts', x => (x.username || '').toLowerCase() === u)[0];
    const ok = a && LOGIN_ROLES[pick].roles.includes(a.role) && (await sha256(a.salt + ':' + p)) === a.passHash;
    if (!ok) { t.n++; if (t.n >= LOCK.max) { t.until = Date.now() + LOCK.ms; t.n = 0; } LOCK.tries[u] = t; err.textContent = `Username atau password salah untuk akun ${LOGIN_ROLES[pick].label}.`; err.hidden = false; return; }
    if (a.pending) { err.textContent = 'Pendaftaran akun Anda masih menunggu persetujuan. Hubungi Super Admin atau HRD.'; err.hidden = false; return; }
    if (!a.active) { err.textContent = 'Akun dinonaktifkan. Hubungi admin.'; err.hidden = false; return; }
    LOCK.tries[u] = { n: 0, until: 0 };
    App.setUser(a); audit('login'); App.render(); showWelcome(a.name);
  };
};

/* latar animasi layar login: jaringan titik bergerak, memenuhi seluruh layar */
Views.loginFx = () => {
  const cv = $('#fxCanvas'); if (!cv || !cv.getContext) return;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx = cv.getContext('2d'); let W = 0, H = 0, pts = [], raf = 0;
  const cols = ['#6F8BFF', '#22D3C5', '#FFB627', '#F0645A'];
  const size = () => { const r = cv.parentElement.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2); W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(110, Math.max(28, W * H / 15000))); pts = Array.from({ length: n }, (_, i) => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35, r: 1.4 + Math.random() * 1.8, c: cols[i % 4] })); };
  const tick = () => {
    if (!cv.isConnected) { cancelAnimationFrame(raf); removeEventListener('resize', size); return; }
    if (!document.hidden) {
      ctx.clearRect(0, 0, W, H);
      for (const p of pts) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; }
      for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) { const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y); if (d < 130) { ctx.strokeStyle = `rgba(160,178,255,${(1 - d / 130) * .32})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); } }
      for (const p of pts) { ctx.fillStyle = p.c; ctx.globalAlpha = .85; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
    raf = requestAnimationFrame(tick);
  };
  size(); addEventListener('resize', size); tick();
};

      font(6.5, 'bold', C.muted); doc.text(String(g[f]), X(i), Y(g[f]) - 2.8, { align: 'center' });
      font(9, 'bold', C[f]); doc.text(f, X(i), y0 + gh - 3, { align: 'center' });

  };
  need(gh + 4);
  chart(sc.g[0], 'Graph 1 - Mask', 'Public Self (Line 1)', sc.p[0].key, M, y);

  drawC(C.line); fillC('#FAFBFF'); doc.setLineWidth(.3); doc.roundedRect(M, y, CW, bh, 2, 2, 'FD');

  /* tanda tangan (kanan bawah halaman terakhir) */

  /* funnel */
  const fun = [['Peserta psikotes', total, 'var(--s1)'], ['Dilanjutkan ke interview', cont, 'var(--s3)'], ['Diterima', acc, 'var(--st-good)']];
  const funnel = fun.map(([l, v, c]) => `<div class="hbar"><div class="hbar-l">${l}</div><div class="hbar-t"><i style="width:${total ? v / total * 100 : 0}%;background:${c}" title="${l}: ${v} (${pct(v, total)}% dari peserta)"></i></div><div class="hbar-v">${v}<span>${pct(v, total)}%</span></div></div>`).join('');

  /* status HR */
  const stCount = Object.keys(STATUS_COLOR).map(k => ({ l: k, c: STATUS_COLOR[k], v: rows.filter(x => x.status === k).length }));
  const stBar = total ? `<div class="hbar-t stack-bar" style="height:26px">${stCount.filter(s => s.v).map(s => `<i style="width:${s.v / total * 100}%;background:${s.c}" title="${s.l}: ${s.v}"></i>`).join('')}</div>` : '';

  /* per bulan */
  const mon = Array.from({ length: 12 }, (_, i) => { const rs = inYear.filter(x => x.m === i + 1); return { n: rs.length, c: rs.filter(x => x.cont).length }; });
  const mmax = Math.max(1, ...mon.map(m => m.n)); const BH = 170;
  const mchart = `<div class="mchart">${mon.map((m, i) => `<div class="mcol ${month !== 'all' && +month === i + 1 ? 'sel' : ''}"><div class="bars"><i style="height:${Math.round(m.n / mmax * BH)}px;background:var(--s1)" title="${BULAN[i]} ${year}: ${m.n} peserta psikotes"></i><i style="height:${Math.round(m.c / mmax * BH)}px;background:var(--s2)" title="${BULAN[i]} ${year}: ${m.c} dilanjutkan ke interview"></i></div><span class="lab">${BULAN[i].slice(0, 3)}</span><span class="val">${m.n}</span></div>`).join('')}</div>`;

  /* per unit */
  const um = {}; rows.forEach(x => { (um[x.unit] = um[x.unit] || { n: 0, c: 0 }); um[x.unit].n++; if (x.cont) um[x.unit].c++; });
  const ul = Object.entries(um).sort((a, b) => b[1].n - a[1].n || a[0].localeCompare(b[0])); const umax = Math.max(1, ...ul.map(u => u[1].n));
  const unitChart = ul.map(([u, v]) => `<div class="hbar"><div class="hbar-l">${esc(u)}</div><div class="hbar-t" style="background:transparent"><div class="seg-wrap" style="width:${v.n / umax * 100}%">${v.c ? `<i style="flex:${v.c};background:var(--s3)" title="${esc(u)}: ${v.c} dilanjutkan ke interview"></i>` : ''}${v.n - v.c ? `<i style="flex:${v.n - v.c};background:var(--s1)" title="${esc(u)}: ${v.n - v.c} belum/tidak dilanjutkan"></i>` : ''}</div></div><div class="hbar-v">${v.n}<span>${v.c} lanjut</span></div></div>`).join('');

  /* rekomendasi */
  const tiers = Object.keys(TIER_COLOR).map(k => ({ l: k, c: TIER_COLOR[k], v: rows.filter(x => x.R.tier === k).length })).filter(t => t.v);
  /* dominan */
  const dom = F.map(k => ({ k, v: rows.filter(x => x.dom === k).length })); const dmax = Math.max(1, ...dom.map(d => d.v));
  const domChart = dom.map(d => `<div class="hbar"><div class="hbar-l"><span class="fbadge f${d.k}">${d.k}</span> ${FNAME[d.k]}</div><div class="hbar-t"><i style="width:${d.v / dmax * 100}%;background:var(--d${d.k})" title="${FNAME[d.k]}: ${d.v} peserta"></i></div><div class="hbar-v">${d.v}<span>${pct(d.v, total)}%</span></div></div>`).join('');

  const empty = '<div class="empty">Tidak ada peserta psikotes pada periode ini.</div>';
  const list = rows.slice().sort((a, b) => b.date.localeCompare(a.date));
  return `<div class="page-head"><div><div class="eyebrow">${esc(Store.get('companies', S.companyId)?.name || '')}</div><h1>Dashboard Eksekutif</h1><p>Ringkasan rekrutmen berdasarkan tanggal pelaksanaan psikotes. Atur bulan, tahun, dan unit untuk melihat periode yang berbeda.</p></div></div>
  <div class="card card-pad filters">
    <label class="f">Tahun<select class="input" id="fxY">${years.map(y => `<option ${y === year ? 'selected' : ''}>${y}</option>`).join('')}</select></label>
    <label class="f">Bulan<select class="input" id="fxM"><option value="all" ${month === 'all' ? 'selected' : ''}>Semua bulan</option>${BULAN.map((b, i) => `<option value="${i + 1}" ${month !== 'all' && +month === i + 1 ? 'selected' : ''}>${b}</option>`).join('')}</select></label>
    <label class="f">Unit<select class="input" id="fxU"><option value="">Semua unit</option>${unitNames.map(u => `<option ${u === unit ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select></label>
    <div class="small muted" style="margin-left:auto">Periode: <b style="color:var(--text)">${period}</b>${unit ? ' · ' + esc(unit) : ''}</div>
  </div>
  <div class="grid g4">
    <div class="card kpi k-blue"><span class="eyebrow">Peserta psikotes</span><b>${total}</b><span class="small">${period}</span></div>
    <div class="card kpi k-teal"><span class="eyebrow">Dilanjutkan ke interview</span><b>${cont}</b><span class="small">${pct(cont, total)}% dari peserta</span></div>
    <div class="card kpi k-purple"><span class="eyebrow">Diterima</span><b>${acc}</b><span class="small">${pct(acc, total)}% dari peserta</span></div>
    <div class="card kpi k-orange"><span class="eyebrow">Belum diputuskan</span><b>${pend}</b><span class="small">menunggu keputusan HR</span></div>
  </div>
  <div class="grid g2">
    <div class="card card-pad stack"><div><h3>Alur peserta</h3><div class="small muted">Dari psikotes sampai diterima, ${period.toLowerCase()}</div></div>${total ? funnel : empty}
      <div class="small muted">“Dilanjutkan ke interview” = status HR Lanjut wawancara, Lanjut tes kesehatan, atau Diterima, atau sudah dijadwalkan wawancara.</div></div>
    <div class="card card-pad stack"><div><h3>Status keputusan HR</h3><div class="small muted">Jumlah peserta per status</div></div>${total ? stBar + legend(stCount.filter(s => s.v)) : empty}</div>
  </div>
  <div class="card card-pad stack"><div class="row" style="justify-content:space-between"><div><h3>Peserta per bulan, ${year}</h3><div class="small muted">Angka di bawah bulan = jumlah peserta psikotes${unit ? ' unit ' + esc(unit) : ''}</div></div>${legend([{ l: 'Peserta psikotes', c: 'var(--s1)' }, { l: 'Dilanjutkan ke interview', c: 'var(--s2)' }])}</div>
    ${inYear.length ? mchart : `<div class="empty">Belum ada peserta pada tahun ${year}.</div>`}
    <details><summary class="small muted" style="cursor:pointer">Lihat sebagai tabel</summary><div class="tbl-wrap"><table class="tbl no-stack"><thead><tr><th>Bulan</th><th class="num">Peserta</th><th class="num">Dilanjutkan</th></tr></thead><tbody>${mon.map((m, i) => `<tr><td>${BULAN[i]}</td><td class="num">${m.n}</td><td class="num">${m.c}</td></tr>`).join('')}</tbody></table></div></details></div>
  <div class="grid g2">
    <div class="card card-pad stack"><div><h3>Peserta mendaftar per unit</h3><div class="small muted">${period}</div></div>${ul.length ? unitChart + legend([{ l: 'Dilanjutkan ke interview', c: 'var(--s3)' }, { l: 'Belum/tidak dilanjutkan', c: 'var(--s1)' }]) : empty}</div>
    <div class="card card-pad stack"><div><h3>Rekomendasi hasil psikotes</h3><div class="small muted">Kesesuaian profil DISC dengan unit yang dilamar</div></div>${total ? `<div class="donut-wrap">${donutSvg(tiers, total, 'Distribusi rekomendasi psikotes')}${legend(tiers)}</div>` : empty}</div>
  </div>
  <div class="card card-pad stack"><div><h3>Kepribadian dominan peserta</h3><div class="small muted">Faktor DISC tertinggi pada Graph 3 (kepribadian asli)</div></div>${total ? domChart : empty}</div>
  <div class="card"><div class="card-head"><h3>Daftar peserta pada periode</h3><span class="small muted">${total} peserta</span></div>
    ${list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Peserta</th><th>Unit</th><th>Tanggal tes</th><th class="num">Kesesuaian</th><th>Rekomendasi</th><th>Status HR</th></tr></thead><tbody>
    ${list.map(x => `<tr class="click" data-open="${x.r.id}"><td><b>${esc(x.r.name)}</b>${sampleTag(x.r)}</td><td>${esc(x.unit)}</td><td class="small">${fmtDate(x.date)}</td><td class="num">${x.R.fit ?? '–'}${x.R.fit != null ? '%' : ''}</td><td><span class="pill ${x.R.level}">${esc(x.R.tier)}</span></td><td><span class="pill ${x.status === 'Diterima' ? 'ok' : x.status === 'Tidak dilanjutkan' ? 'bad' : x.cont ? 'info' : ''}">${esc(x.status)}</span></td></tr>`).join('')}
    </tbody></table></div>` : empty}</div>`;
};

Views.testEditMount = c => {
  const d = S._draft;
  const sync = () => {
    d.title = $('#t_title', c).value.trim(); d.unit = $('#t_unit', c).value; d.minutes = +$('#t_min', c).value || 10; d.passing = +$('#t_pass', c).value || 0; d.active = $('#t_act', c).value === '1';
    $$('[data-qi]', c).forEach(card => { const i = +card.dataset.qi; const q = d.questions[i];
      q.q = $('[data-f=q]', card).value.trim(); q.w = +$('[data-f=w]', card).value || 1;
      $$('[data-f=o]', card).forEach(inp => q.o[+inp.dataset.j] = inp.value.trim());
      const ch = $('[data-f=a]:checked', card); q.a = ch ? +ch.value : 0; });
  };
  $('#addQ', c).onclick = () => { sync(); d.questions.push({ q: '', o: ['', '', '', ''], a: 0, w: 1 }); App.renderContent(); };
  $$('[data-delq]', c).forEach(b => b.onclick = () => { sync(); d.questions.splice(+b.dataset.delq, 1); App.renderContent(); });
  $('#tSave', c).onclick = async () => {
    sync();
    if (!d.title || !d.unit) { toast('Judul dan unit wajib diisi'); return; }

function gcalUrl(m) {
  const s = new Date(m.start); const e = new Date(s.getTime() + (m.duration || 45) * 60000);
  const f = d => `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
  const p = new URLSearchParams({ action: 'TEMPLATE', text: `${m.title} – ${m.candidateName || ''}`, dates: `${f(s)}/${f(e)}`, details: m.agenda || '', ctz: 'Asia/Jakarta' });
  if (m.email) p.set('add', m.email);
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}
function findUrl(o, re) {
  if (!o) return null;
  if (typeof o === 'string') { const m = o.match(re); return m ? m[0] : null; }
  if (Array.isArray(o)) { for (const x of o) { const r = findUrl(x, re); if (r) return r; } return null; }
  if (typeof o === 'object') { if (typeof o.join_url === 'string') return o.join_url; for (const k in o) { if (k === 'start_url') continue; const r = findUrl(o[k], re); if (r) return r; } }
  return null;
}
async function createZoom(m) {
  let mcp = null; try { if (window.claude) mcp = await claude.use('mcp'); } catch (e) {}
  if (!mcp) return { err: 'Pembuatan rapat Zoom otomatis hanya tersedia saat aplikasi dibuka melalui claude.ai dengan konektor Zoom. Buat rapat di zoom.us/meeting/schedule lalu tempel tautannya di bawah.' };
  try {
    const res = await mcp.callTool('Zoom for Claude', 'meeting_create', { userId: 'me', topic: `${m.title} – ${m.candidateName || ''}`.slice(0, 190), type: 2, start_time: m.start.length === 16 ? m.start + ':00' : m.start, timezone: 'Asia/Jakarta', duration: +m.duration || 45, agenda: (m.agenda || '').slice(0, 1900), settings: { waiting_room: true, meeting_invitees: m.email ? [{ email: m.email }] : undefined } });
    const url = findUrl(res.payload, /https:\/\/[\w.-]*zoom\.us\/j\/[^\s"'<>)]+/) || findUrl(res.content, /https:\/\/[\w.-]*zoom\.us\/j\/[^\s"'<>)]+/);
    const pwd = res.payload && typeof res.payload === 'object' ? (res.payload.password || res.payload.meeting?.password || '') : '';
    const mid = res.payload && typeof res.payload === 'object' ? (res.payload.id || res.payload.meeting?.id || '') : '';
    if (!url) return { err: 'Rapat mungkin sudah dibuat, tetapi tautan tidak terbaca. Cek akun Zoom Anda sebelum mencoba lagi.' };
    return { url, pwd, mid };
  } catch (e) {
    const msg = { server_not_connected: 'Konektor Zoom belum ditambahkan. Tambahkan “Zoom for Claude” di claude.ai → Settings → Connectors.', needs_reauth: 'Sambungan Zoom kedaluwarsa. Hubungkan ulang Zoom di claude.ai → Settings → Connectors.', not_in_manifest: 'Izin konektor Zoom untuk halaman ini ditolak.', blocked_by_policy: 'Kebijakan organisasi memblokir pembuatan rapat Zoom.', approval_required: 'Pembuatan rapat Zoom memerlukan persetujuan admin organisasi.', selection_required: 'Pilih akun Zoom yang dipakai pada prompt claude.ai, lalu coba lagi.', tool_error: 'Zoom menolak permintaan: ' + (e.message || '') }[e?.code];
    return { err: msg || ('Gagal menghubungi Zoom (' + (e?.code || 'error') + '). Cek akun Zoom Anda sebelum mencoba lagi agar tidak terbuat dua kali.') };
  }
}

Views.overtime = () => {

  const rows = Store.all('overtime', x => inScope(x) && (x.date || '').startsWith(month)).sort((a, b) => a.date.localeCompare(b.date));
  let tot = 0;
  const body = rows.map(o => { const e = em[o.employeeId]; if (!e) return ''; const mult = otMultiplier(o.hours, o.dayType, st.workDays); const amt = mult * hourlyWage(e); tot += amt;
    const warn = o.dayType === 'kerja' && o.hours > 4;
    return `<tr><td class="small">${fmtDate(o.date)}</td><td><b>${esc(e.name)}</b>${sampleTag(o)}<div class="small muted">${esc(e.unit)}</div></td><td><span class="pill ${o.dayType === 'kerja' ? '' : 'acc'}">${o.dayType === 'kerja' ? 'Hari kerja' : 'Hari libur'}</span></td><td class="num">${nf(o.hours, 1)}${warn ? ' <span class="pill warn" title="PP 35/2021: maks. 4 jam/hari">>4</span>' : ''}</td><td class="num">${nf(mult, 1)}×</td><td class="num">${nf(hourlyWage(e))}</td><td class="num"><b>${nf(amt)}</b></td><td class="small muted">${esc(o.note || '')}</td><td><button class="btn sm danger" data-del="${o.id}" aria-label="Hapus">✕</button></td></tr>`; }).join('');
  const weekly = {}; rows.forEach(o => { const d = new Date(o.date + 'T00:00:00'); const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7)); const k = o.employeeId + '|' + mon.toISOString().slice(0, 10); weekly[k] = (weekly[k] || 0) + (+o.hours || 0); });
  const over = Object.entries(weekly).filter(([, h]) => h > 18);
  return `<div class="page-head"><div><h1>Lembur</h1><p>Perhitungan sesuai PP 35/2021: upah sejam = 1/173 × (gaji pokok + tunjangan tetap). Hari kerja: jam ke-1 1,5×, jam berikutnya 2×. Hari libur (${st.workDays} hari kerja/minggu): jam ke-1–${st.workDays == 6 ? 7 : 8} 2×, jam ke-${st.workDays == 6 ? 8 : 9} 3×, selanjutnya 4×.</p></div>

  <div class="card">${rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tanggal</th><th>Karyawan</th><th>Jenis hari</th><th class="num">Jam</th><th class="num">Pengali</th><th class="num">Upah/jam</th><th class="num">Upah lembur</th><th>Keterangan</th><th></th></tr></thead><tbody>${body}</tbody>
    <tfoot><tr><td colspan="6">Total ${fmtMonth(month)}</td><td class="num">${nf(tot)}</td><td colspan="2"></td></tr></tfoot></table></div>` : `<div class="empty">Tidak ada lembur pada ${fmtMonth(month)}.</div>`}</div>`;
};

/* ---- Cuti ---- */
const LEAVE_TYPES = ['Tahunan', 'Sakit', 'Melahirkan', 'Menikah', 'Duka', 'Izin Khusus', 'Tanpa Upah'];
function leaveBalance(e, year, st) {
  const used = Store.all('leaves', l => l.employeeId === e.id && l.type === 'Tahunan' && l.status === 'Disetujui' && l.start.startsWith(String(year))).reduce((s, l) => s + workingDaysBetween(l.start, l.end, st.workDays), 0);
  const pending = Store.all('leaves', l => l.employeeId === e.id && l.type === 'Tahunan' && l.status === 'Menunggu' && l.start.startsWith(String(year))).reduce((s, l) => s + workingDaysBetween(l.start, l.end, st.workDays), 0);
  const j = new Date(e.joinDate + 'T00:00:00'); const elig = new Date(j); elig.setFullYear(j.getFullYear() + 1);
  const eligible = elig <= new Date(`${year}-12-31T00:00:00`);
  const quota = eligible ? (+st.annualLeave || 12) : 0;
  return { used, pending, quota, left: quota - used, eligible, eligDate: elig };
}

  const stPill = s => `<span class="pill ${s === 'Disetujui' ? 'ok' : s === 'Ditolak' ? 'bad' : 'warn'}">${esc(s)}</span>`;

  <div class="tabs"><button class="tab ${tab === 'req' ? 'on' : ''}" data-tab="req">Pengajuan</button><button class="tab ${tab === 'sum' ? 'on' : ''}" data-tab="sum">Rekap ${year}</button></div>
  ${tab === 'req' ? `<div class="card">${reqs.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Karyawan</th><th>Jenis</th><th>Tanggal</th><th class="num">Hari kerja</th><th>Alasan</th><th>Status</th><th></th></tr></thead><tbody>
    ${reqs.map(l => { const e = em[l.employeeId]; return `<tr><td><b>${esc(e.name)}</b>${sampleTag(l)}<div class="small muted">${esc(e.unit)}</div></td><td>${esc(l.type)}</td><td class="small">${fmtDate(l.start)} – ${fmtDate(l.end)}</td><td class="num">${workingDaysBetween(l.start, l.end, st.workDays)}</td><td class="small muted">${esc(l.reason || '')}</td><td>${stPill(l.status)}</td>

  </tbody></table></div>` : '<div class="empty">Belum ada pengajuan cuti.</div>'}</div>`
  : `<div class="row"><label class="row small muted">Tahun <input class="input" type="number" id="ly" value="${year}" min="2020" max="2100" style="width:100px"></label></div>
  <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Karyawan</th><th>Mulai kerja</th><th class="num">Hak cuti</th><th class="num">Terpakai</th><th class="num">Menunggu</th><th class="num">Sisa</th>${LEAVE_TYPES.filter(t => t !== 'Tahunan').map(t => `<th class="num">${t}</th>`).join('')}</tr></thead><tbody>
    ${emps.map(e => { const b = leaveBalance(e, year, st); const cnt = t => Store.all('leaves', l => l.employeeId === e.id && l.type === t && l.status === 'Disetujui' && l.start.startsWith(String(year))).reduce((s, l) => s + workingDaysBetween(l.start, l.end, st.workDays), 0);
      return `<tr><td><b>${esc(e.name)}</b><div class="small muted">${esc(e.unit)}</div></td><td class="small">${fmtDate(e.joinDate)}${b.eligible ? '' : `<div class="pill warn">berhak mulai ${fmtDate(b.eligDate.toISOString().slice(0, 10))}</div>`}</td><td class="num">${b.quota}</td><td class="num">${b.used}</td><td class="num">${b.pending}</td><td class="num"><b style="color:${b.left < 0 ? 'var(--bad)' : b.left <= 2 ? 'var(--warn)' : 'inherit'}">${b.left}</b></td>${LEAVE_TYPES.filter(t => t !== 'Tahunan').map(t => `<td class="num">${cnt(t) || '–'}</td>`).join('')}</tr>`; }).join('')}

};

      <div id="lPrev" class="note" style="grid-column:1/-1"></div></form>`,

        f.oninput = prev; f.onchange = prev; prev();
        f.onsubmit = async ev => { ev.preventDefault(); const d = formData(f); if (d.end < d.start) { toast('Periksa tanggal'); return; } await Store.put('leaves', uid('l'), { companyId: S.companyId, employeeId: d.employeeId, type: d.type, start: d.start, end: d.end, reason: d.reason, status: d.status, createdAt: nowISO(), createdBy: S.user.id }); audit('input cuti', Store.get('employees', d.employeeId)?.name); closeModal(); App.renderContent(); toast('Pengajuan disimpan'); }; } }); };
